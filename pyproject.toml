[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smarty-jones"
version = "0.1.0"
description = "A lightweight debugging assistant that provides AI-powered error analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Smarty Jones Team", email = "contact@smarty-jones.dev"}
]
maintainers = [
    {name = "Smarty Jones Team", email = "contact@smarty-jones.dev"}
]
keywords = [
    "debugging", 
    "error-analysis", 
    "ai", 
    "llm", 
    "python", 
    "exception-handling",
    "development-tools",
    "code-analysis"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers", 
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.8"
dependencies = []  # No dependencies - pure Python!

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov", 
    "black",
    "flake8",
    "mypy",
    "isort",
    "pre-commit"
]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "black", 
    "flake8"
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser"
]

[project.urls]
Homepage = "https://github.com/smarty-jones/smarty-jones"
Documentation = "https://docs.smarty-jones.dev"
Repository = "https://github.com/smarty-jones/smarty-jones"
"Bug Tracker" = "https://github.com/smarty-jones/smarty-jones/issues"

[project.scripts]
smarty-jones = "smarty_jones.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smarty_jones*"]

[tool.setuptools.package-data]
smarty_jones = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-v"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "slow: Slow tests"
]